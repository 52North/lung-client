<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="'download-data.title' | translate"
  [matTooltip]="'download-data.title' | translate"
>
  <mat-icon>download</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="exportCSV()">
    {{ "download-data.csv-export" | translate }}
  </button>
  <button mat-menu-item (click)="exportXSLX()">
    {{ "download-data.xlsx-export" | translate }}
  </button>
</mat-menu>
