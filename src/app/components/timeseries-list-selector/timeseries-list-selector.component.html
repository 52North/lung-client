@if (loading) {
  <div>{{ "timeseries-list-selector.loading" | translate }}</div>
}
@if (!loading && items.length === 0) {
  <div>{{ "timeseries-list-selector.no-results" | translate }}</div>
}
<mat-selection-list
  #parameters
  [multiple]="true"
  (selectionChange)="selectionChanged($event)"
>
  @for (item of items; track item) {
    <mat-list-option
      [value]="item"
      color="primary"
      [selected]="item.internalId && timeseriesSrvc.hasDataset(item.internalId)"
    >
      {{ item.label }}
    </mat-list-option>
  }
</mat-selection-list>
