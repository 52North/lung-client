@if (username()) {
  @if (isAdmin()) {
    <a
      mat-button
      [href]="adminUrl"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="
        'authentication.admin-link' | translate: { user: username() }
      "
    >
      {{ username() }} [ADMIN]
    </a>
  } @else {
    <div>{{ username() }}</div>
  }
} @else {
  <div>{{ "authentication.not_logged_in" | translate }}</div>
}
