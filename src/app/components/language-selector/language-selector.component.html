<mat-form-field>
  <mat-label>{{
    "main-config.language-selector.placeholder" | translate
  }}</mat-label>
  <mat-select
    [value]="currentLang"
    (selectionChange)="setLanguage($event.value)"
  >
    @for (lang of languageList(); track lang) {
      <mat-option [value]="lang">{{ lang.label }} </mat-option>
    }
  </mat-select>
</mat-form-field>
