<h1 mat-dialog-title>{{ "change-data-source-modal.title" | translate }}</h1>
<mat-dialog-content>
  <div class="full-height">
    <helgoland-common-service-list-selector
      [datasetApiList]="datasetApis"
      [filter]="filter"
      [providerBlacklist]="blacklist"
      [selectedService]="selectedDataSourceSrvc.selectedService()"
      [supportStations]="true"
      (onServiceSelected)="serviceSelected($event)"
    ></helgoland-common-service-list-selector>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <div style="flex: 1"></div>
  <button mat-raised-button mat-dialog-close cdkFocusInitial>
    {{ "controls.ok" | translate }}
  </button>
</mat-dialog-actions>
