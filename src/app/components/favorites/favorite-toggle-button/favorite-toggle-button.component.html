@if (canBeFavorite) {
  <button
    mat-icon-button
    (click)="toggle(); $event.stopPropagation()"
    attr.aria-label="{{ labelKey() | translate }}"
    matTooltip="{{ labelKey() | translate }}"
  >
    @if (isFavorite()) {
      <mat-icon style="color: #c3c30e">star</mat-icon>
    }
    @if (!isFavorite()) {
      <mat-icon>star_border</mat-icon>
    }
  </button>
}
