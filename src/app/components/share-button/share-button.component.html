@if (label(); as labelKey) {
  <button mat-button (click)="shareState()">
    <mat-icon>share</mat-icon>
    <span>{{ labelKey | translate }}</span>
  </button>
} @else {
  <button
    mat-icon-button
    (click)="shareState()"
    matTooltip="{{ 'share-button.tooltip' | translate }}"
    attr.aria-label="{{ 'share-button.tooltip' | translate }}"
  >
    <mat-icon>share</mat-icon>
  </button>
}
