<h1 mat-dialog-title>Metadaten von MetaVer für die ID {{ metadataId() }}</h1>

<mat-dialog-content>
  <pre>{{ xmlContent }}</pre>
</mat-dialog-content>

<div mat-dialog-actions>
  <div style="flex: 1"></div>
  <button mat-button [mat-dialog-close]>
    {{ "controls.ok" | translate }}
  </button>
</div>
