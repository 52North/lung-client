<button

  [matMenuTriggerFor]="menu"

  matTooltip="Datenexport"
>
  <mat-icon>download</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="exportCSV()">Daten als CSV exportieren</button>
  <button mat-menu-item (click)="exportXSLX()">
    Daten als XSLX exportieren
  </button>
</mat-menu>
